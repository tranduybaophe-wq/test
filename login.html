<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Primux - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary-deep": "#1e3a8a",
                        "primary-main": "#2563eb",
                        "primary-light": "#60a5fa",
                        "gold-dark": "#d97706"
                    },
                    fontFamily: { sans: ["Be Vietnam Pro", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f8fbff; overflow-x: hidden; }
        .card-shadow { box-shadow: 0 20px 40px -15px rgba(30, 58, 138, 0.12); }
        .btn-shadow { box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25); transition: all 0.3s ease; }
        .btn-shadow:hover { box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35); transform: translateY(-1px); }

        @keyframes spinOrbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .orbit-spin { animation: spinOrbit 20s linear infinite; }
        .sci-float-1 { animation: floatMath 7s ease-in-out infinite; }
        .sci-float-2 { animation: floatMath 9s ease-in-out infinite 2s; }
        .sci-float-3 { animation: floatMath 8s ease-in-out infinite 4s; }

        @keyframes floatMath {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .page-transition-overlay { position: fixed; inset: 0; background-color: #1e3a8a; z-index: 9999; pointer-events: none; opacity: 1; transition: opacity 0.35s ease; }
        .page-transition-overlay.hidden-overlay { opacity: 0; }
    </style>
</head>
<body class="bg-[#f4f8ff] text-slate-900 min-h-screen flex flex-col relative">
    <div id="pageOverlay" class="page-transition-overlay"></div>

    <!-- BACKGROUND NỀN CHUYỂN ĐỘNG CÔNG THỨC & HÌNH HỌC -->
    <div class="fixed inset-0 pointer-events-none select-none overflow-hidden z-0 opacity-40">
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#2563eb0a_1px,transparent_1px),linear-gradient(to_bottom,#2563eb0a_1px,transparent_1px)] bg-[size:40px_40px]"></div>

        <div class="absolute top-1/2 left-1/4 -translate-x-1/2 -translate-y-1/2">
            <svg class="w-[500px] h-[500px]" viewBox="0 0 400 400" fill="none">
                <g class="orbit-spin" style="transform-origin: 200px 200px;">
                    <ellipse cx="200" cy="200" rx="160" ry="60" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" transform="rotate(30 200 200)"/>
                    <ellipse cx="200" cy="200" rx="160" ry="60" stroke="#d97706" stroke-width="2" transform="rotate(90 200 200)"/>
                    <circle cx="360" cy="200" r="5" fill="#2563eb" transform="rotate(30 200 200)"/>
                </g>
            </svg>
        </div>

        <div class="absolute top-12 left-12 text-blue-600 font-mono text-xl font-bold sci-float-1">∫ f(x)dx = F(x)</div>
        <div class="absolute bottom-16 left-20 text-amber-600 font-mono text-2xl font-black sci-float-2">E = mc²</div>
        <div class="absolute top-1/3 right-16 text-emerald-600 font-mono text-xl font-bold sci-float-3">H₂O ⇌ H⁺ + OH⁻</div>
        <div class="absolute bottom-12 right-24 text-indigo-600 font-mono text-xl font-bold sci-float-1">PV = nRT</div>
    </div>

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-blue-100">
        <div class="flex justify-between items-center w-full px-8 h-[72px] max-w-7xl mx-auto">
            <a href="index.html" class="nav-link flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-lg shadow-md">P</div>
                <span class="text-2xl font-black text-blue-950">Primux</span>
            </a>
            <div class="flex items-center gap-4">
                <a class="nav-link text-sm font-bold text-blue-900 px-5 py-2.5 hover:bg-blue-50 rounded-full transition-all" href="register.html">Đăng ký</a>
                <a class="nav-link text-sm font-extrabold text-white bg-blue-600 px-6 py-2.5 rounded-full btn-shadow" href="login.html">Đăng nhập</a>
            </div>
        </div>
    </header>

    <!-- Main Form -->
    <main class="flex-grow flex w-full relative z-10 items-center justify-center p-6 md:p-12">
        <div class="w-full max-w-md bg-white/95 backdrop-blur-md p-8 md:p-10 rounded-3xl card-shadow border border-blue-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl md:text-3xl font-black text-blue-950 mb-1">Chào mừng trở lại!</h2>
                <p class="text-xs md:text-sm text-slate-500 font-medium">Đăng nhập để vào không gian ôn thi THPTQG.</p>
            </div>

            <div id="generalAlert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl flex items-center gap-2.5 text-red-600 text-xs font-bold">
                <span class="material-symbols-outlined text-[18px]">error</span>
                <span>Vui lòng điền đầy đủ thông tin!</span>
            </div>

            <form id="loginForm" class="space-y-4" novalidate>
                <div>
                    <label class="block text-xs font-bold text-blue-900 mb-1.5" for="identifier">Email hoặc Số điện thoại</label>
                    <div class="relative border border-slate-200 rounded-xl bg-slate-50 focus-within:border-blue-600">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <span class="material-symbols-outlined text-[18px]">person</span>
                        </span>
                        <input class="block w-full pl-10 pr-3 py-3 border-none rounded-xl bg-transparent text-xs md:text-sm font-medium focus:ring-0 text-slate-900" id="identifier" placeholder="Nhập email hoặc SĐT" type="text"/>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-blue-900 mb-1.5" for="password">Mật khẩu</label>
                    <div class="relative border border-slate-200 rounded-xl bg-slate-50 focus-within:border-blue-600">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <span class="material-symbols-outlined text-[18px]">lock</span>
                        </span>
                        <input class="block w-full pl-10 pr-10 py-3 border-none rounded-xl bg-transparent text-xs md:text-sm font-medium focus:ring-0 text-slate-900" id="password" placeholder="Nhập mật khẩu" type="password"/>
                    </div>
                </div>

                <button id="btnLogin" class="w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl font-extrabold text-white bg-blue-600 hover:bg-blue-700 btn-shadow active:scale-[0.98] transition-all" type="submit">
                    <span>Đăng nhập ngay</span>
                </button>
            </form>

            <!-- Hoặc đăng nhập bằng mạng xã hội -->
            <div class="mt-6 relative">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                <div class="relative flex justify-center text-xs"><span class="px-3 bg-white text-slate-500 font-bold uppercase tracking-wider">Hoặc tiếp tục với</span></div>
            </div>

            <div class="mt-5 grid grid-cols-2 gap-3">
                <button onclick="socialLogin('Google')" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs font-bold text-slate-700 transition">
                    <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c-.07-.84-.63-1.56-1.47-1.87H12v4.5h6.63c-.3 1.5-1.83 4.5-6.63 4.5-3.99 0-7.23-3.24-7.23-7.23s3.24-7.23 7.23-7.23c2.25 0 3.75.96 4.62 1.77l3.36-3.36C17.91 2.25 15.21 1.5 12 1.5 6.48 1.5 2 5.98 2 11.5s4.48 10 10 10c5.79 0 9.63-4.08 9.63-9.84 0-.69-.06-1.26-.18-1.39z"/></svg>
                    Google
                </button>
                <button onclick="socialLogin('Facebook')" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs font-bold text-slate-700 transition">
                    <svg class="w-4 h-4 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Facebook
                </button>
            </div>

            <div class="mt-6 text-center text-xs font-medium text-slate-500">
                Chưa có tài khoản? <a class="nav-link font-extrabold text-blue-600 hover:underline ml-1" href="register.html">Đăng ký ngay</a>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pageOverlay')?.classList.add('hidden-overlay');
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && href !== '#' && !href.startsWith('javascript')) {
                    e.preventDefault();
                    const overlay = document.getElementById('pageOverlay');
                    if (overlay) overlay.classList.remove('hidden-overlay');
                    setTimeout(() => window.location.href = href, 300);
                }
            });
        });

        function socialLogin(provider) {
            localStorage.setItem('primux_user_name', `Thành viên ${provider}`);
            localStorage.setItem('primux_is_elite', 'true');
            localStorage.setItem('primux_elite_plan', '6 Tháng');
            
            const btn = document.getElementById('btnLogin');
            if (btn) {
                btn.disabled = true;
                btn.className = "w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl font-extrabold text-white bg-emerald-600 transition-all scale-[1.02]";
                btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-bounce">check_circle</span><span>Bạn đã sẵn sàng!</span>`;
            }

            setTimeout(() => {
                const overlay = document.getElementById('pageOverlay');
                if (overlay) overlay.classList.remove('hidden-overlay');
                setTimeout(() => window.location.href = 'index.html', 400);
            }, 1000);
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('identifier').value.trim();
            const pwd = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('generalAlert');

            if (!id || !pwd) {
                if (alertBox) alertBox.classList.remove('hidden');
            } else {
                if (alertBox) alertBox.classList.add('hidden');
                localStorage.setItem('primux_user_name', id.split('@')[0] || 'Học Sinh');
                
                const btn = document.getElementById('btnLogin');
                btn.disabled = true;
                btn.className = "w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl font-extrabold text-white bg-emerald-600 transition-all scale-[1.02]";
                btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-bounce">check_circle</span><span>Bạn đã sẵn sàng!</span>`;

                setTimeout(() => {
                    const overlay = document.getElementById('pageOverlay');
                    if (overlay) overlay.classList.remove('hidden-overlay');
                    setTimeout(() => window.location.href = 'index.html', 400);
                }, 1200);
            }
        });
    </script>
</body>
</html>
