<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Đăng ký - Primux THPT</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary-deep": "#1e3a8a",
                        "primary-main": "#2563eb",
                        "primary-light": "#60a5fa",
                        "gold-dark": "#d97706"
                    },
                    fontFamily: { sans: ["Be Vietnam Pro", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f8fbff; overflow-x: hidden; }
        .card-shadow { box-shadow: 0 20px 40px -15px rgba(30, 58, 138, 0.15); }
        .btn-shadow { box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25); transition: all 0.3s ease; }
        .btn-shadow:hover { box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35); transform: translateY(-1px); }

        /* Animation quỹ đạo và đồ thị */
        @keyframes spinOrbit { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .orbit-spin { animation: spinOrbit 24s linear infinite; }
        .orbit-spin-reverse { animation: spinOrbit 18s linear infinite reverse; }

        @keyframes waveFloat {
            0%, 100% { transform: translateY(0px) scaleY(1); }
            50% { transform: translateY(-12px) scaleY(1.1); }
        }
        .graph-wave { animation: waveFloat 6s ease-in-out infinite; }

        @keyframes floatMath {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-18px) rotate(5deg); opacity: 1; }
        }
        .sci-float-1 { animation: floatMath 7s ease-in-out infinite; }
        .sci-float-2 { animation: floatMath 9s ease-in-out infinite 2s; }
        .sci-float-3 { animation: floatMath 8s ease-in-out infinite 4s; }
        .sci-float-4 { animation: floatMath 10s ease-in-out infinite 1s; }

        .page-transition-overlay { position: fixed; inset: 0; background-color: #1e3a8a; z-index: 9999; pointer-events: none; opacity: 1; transition: opacity 0.35s ease; }
        .page-transition-overlay.hidden-overlay { opacity: 0; }
    </style>
</head>
<body class="bg-[#f4f8ff] text-slate-900 min-h-screen flex flex-col relative selection:bg-blue-600 selection:text-white">
    <div id="pageOverlay" class="page-transition-overlay"></div>

    <!-- BACKGROUND ĐỒ THỊ & CÔNG THỨC TOÁN LÝ HÓA CHUYỂN ĐỘNG -->
    <div class="fixed inset-0 pointer-events-none select-none overflow-hidden z-0 opacity-50">
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#2563eb0d_1px,transparent_1px),linear-gradient(to_bottom,#2563eb0d_1px,transparent_1px)] bg-[size:36px_36px]"></div>

        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[850px] h-[850px]">
            <svg class="w-full h-full" viewBox="0 0 500 500" fill="none">
                <line x1="50" y1="250" x2="450" y2="250" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 4"/>
                <line x1="250" y1="50" x2="250" y2="450" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 4"/>
                
                <path class="graph-wave" d="M 60 250 Q 150 120 250 250 T 440 250" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.6"/>
                <path class="graph-wave" d="M 100 80 Q 250 420 400 80" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="6 4" fill="none" opacity="0.4"/>

                <g class="orbit-spin" style="transform-origin: 250px 250px;">
                    <ellipse cx="250" cy="250" rx="190" ry="75" stroke="#d97706" stroke-width="2" stroke-dasharray="8 5" transform="rotate(45 250 250)"/>
                    <circle cx="440" cy="250" r="6" fill="#d97706" transform="rotate(45 250 250)"/>
                </g>
                <g class="orbit-spin-reverse" style="transform-origin: 250px 250px;">
                    <ellipse cx="250" cy="250" rx="190" ry="75" stroke="#2563eb" stroke-width="1.8" transform="rotate(120 250 250)"/>
                    <circle cx="440" cy="250" r="5" fill="#2563eb" transform="rotate(120 250 250)"/>
                </g>
            </svg>
        </div>

        <div class="absolute top-16 left-14 text-emerald-600 font-mono text-xl md:text-2xl font-black sci-float-1">Δ = b² - 4ac</div>
        <div class="absolute top-1/3 right-14 text-blue-600 font-mono text-lg md:text-xl font-bold sci-float-2">F = G(m₁m₂)/r²</div>
        <div class="absolute bottom-20 left-16 text-amber-600 font-mono text-xl md:text-2xl font-black sci-float-3">CH₃COOH + C₂H₅OH</div>
        <div class="absolute bottom-16 right-20 text-purple-600 font-mono text-lg md:text-xl font-bold sci-float-4">sin²α + cos²α = 1</div>
        <div class="absolute top-14 right-1/3 text-sky-600 font-mono text-base font-bold sci-float-1">v = v₀ + at</div>
    </div>

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-blue-100">
        <div class="flex justify-between items-center w-full px-6 md:px-8 h-16 md:h-[72px] max-w-7xl mx-auto">
            <a href="index.html" class="nav-link flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-lg shadow-md">P</div>
                <span class="text-2xl font-black text-blue-950 tracking-tight">Primux</span>
            </a>
            <div class="flex items-center gap-3">
                <a class="nav-link text-xs md:text-sm font-extrabold text-white bg-blue-600 px-5 py-2 rounded-full btn-shadow" href="register.html">Đăng ký</a>
                <a class="nav-link text-xs md:text-sm font-bold text-blue-900 px-4 py-2 hover:bg-blue-50 rounded-full transition-all" href="login.html">Đăng nhập</a>
            </div>
        </div>
    </header>

    <!-- Main Form -->
    <main class="flex-grow flex w-full relative z-10 items-center justify-center p-4 md:p-8">
        <div class="w-full max-w-md bg-white/95 backdrop-blur-xl p-7 md:p-9 rounded-3xl card-shadow border border-blue-100">
            <div class="mb-4 text-center">
                <h1 class="text-2xl md:text-3xl font-black text-blue-950 mb-1">Tạo tài khoản mới</h1>
                <p class="text-xs md:text-sm text-slate-500 font-medium">Bắt đầu hành trình ôn thi THPTQG thông minh.</p>
            </div>

            <div id="registerAlert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl flex items-center gap-2.5 text-red-600 text-xs font-bold">
                <span class="material-symbols-outlined text-[18px]">error</span>
                <span id="registerAlertText">Lỗi đăng ký!</span>
            </div>

            <form id="registerForm" class="space-y-3 text-xs md:text-sm" novalidate>
                <div>
                    <label class="block font-bold text-blue-900 mb-1">Họ và tên</label>
                    <div class="relative border border-slate-200 rounded-xl bg-slate-50 focus-within:border-blue-600 transition-all">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <span class="material-symbols-outlined text-[18px]">person</span>
                        </span>
                        <input class="block w-full pl-10 pr-3 py-2.5 rounded-xl border-none focus:ring-0 text-xs md:text-sm text-slate-900 bg-transparent font-medium" id="fullName" placeholder="Nguyễn Anh Hào" type="text" required/>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-blue-900 mb-1">Email</label>
                    <div class="relative border border-slate-200 rounded-xl bg-slate-50 focus-within:border-blue-600 transition-all">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <span class="material-symbols-outlined text-[18px]">mail</span>
                        </span>
                        <input class="block w-full pl-10 pr-3 py-2.5 rounded-xl border-none focus:ring-0 text-xs md:text-sm text-slate-900 bg-transparent font-medium" id="email" placeholder="email@example.com" type="email" required/>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-blue-900 mb-1">Số điện thoại</label>
                    <div class="relative border border-slate-200 rounded-xl bg-slate-50 focus-within:border-blue-600 transition-all">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <span class="material-symbols-outlined text-[18px]">phone_iphone</span>
                        </span>
                        <input class="block w-full pl-10 pr-3 py-2.5 rounded-xl border-none focus:ring-0 text-xs md:text-sm text-slate-900 bg-transparent font-medium" id="phone" placeholder="0901234567" type="tel" required/>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-blue-900 mb-1">Mật khẩu</label>
                    <div class="relative border border-slate-200 rounded-xl bg-slate-50 focus-within:border-blue-600 transition-all">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <span class="material-symbols-outlined text-[18px]">lock</span>
                        </span>
                        <input class="block w-full pl-10 pr-10 py-2.5 rounded-xl border-none focus:ring-0 text-xs md:text-sm text-slate-900 bg-transparent font-medium" id="password" placeholder="Tối thiểu 6 ký tự" type="password" required/>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-blue-900 mb-1">Xác nhận mật khẩu</label>
                    <div class="relative border border-slate-200 rounded-xl bg-slate-50 focus-within:border-blue-600 transition-all">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                            <span class="material-symbols-outlined text-[18px]">lock_reset</span>
                        </span>
                        <input class="block w-full pl-10 pr-10 py-2.5 rounded-xl border-none focus:ring-0 text-xs md:text-sm text-slate-900 bg-transparent font-medium" id="confirmPassword" placeholder="Nhập lại mật khẩu" type="password" required/>
                    </div>
                </div>

                <div class="pt-1">
                    <button id="btnRegister" class="w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl font-extrabold text-white bg-blue-600 hover:bg-blue-700 btn-shadow active:scale-[0.98] transition-all" type="submit">
                        <span>Đăng ký tài khoản</span>
                    </button>
                </div>
            </form>

            <!-- Đăng ký nhanh bằng Google / Facebook -->
            <div class="mt-4 relative">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                <div class="relative flex justify-center text-xs"><span class="px-3 bg-white text-slate-500 font-bold uppercase tracking-wider">Hoặc đăng ký nhanh</span></div>
            </div>

            <div class="mt-3.5 grid grid-cols-2 gap-3">
                <button type="button" onclick="socialRegister('Google')" class="flex items-center justify-center gap-2 py-2 px-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs font-bold text-slate-700 transition shadow-sm">
                    <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c-.07-.84-.63-1.56-1.47-1.87H12v4.5h6.63c-.3 1.5-1.83 4.5-6.63 4.5-3.99 0-7.23-3.24-7.23-7.23s3.24-7.23 7.23-7.23c2.25 0 3.75.96 4.62 1.77l3.36-3.36C17.91 2.25 15.21 1.5 12 1.5 6.48 1.5 2 5.98 2 11.5s4.48 10 10 10c5.79 0 9.63-4.08 9.63-9.84 0-.69-.06-1.26-.18-1.39z"/></svg>
                    Google
                </button>
                <button type="button" onclick="socialRegister('Facebook')" class="flex items-center justify-center gap-2 py-2 px-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs font-bold text-slate-700 transition shadow-sm">
                    <svg class="w-4 h-4 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Facebook
                </button>
            </div>

            <div class="mt-4 text-center text-xs font-medium text-slate-500">
                Đã có tài khoản? <a class="nav-link font-extrabold text-blue-600 hover:underline ml-1" href="login.html">Đăng nhập ngay</a>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pageOverlay')?.classList.add('hidden-overlay');
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && href !== '#' && !href.startsWith('javascript')) {
                    e.preventDefault();
                    document.getElementById('pageOverlay')?.classList.remove('hidden-overlay');
                    setTimeout(() => window.location.href = href, 300);
                }
            });
        });

        function triggerReadySuccess(btnId) {
            const btn = document.getElementById(btnId);
            btn.disabled = true;
            btn.className = "w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl font-extrabold text-white bg-emerald-600 transition-all scale-[1.02] shadow-lg shadow-emerald-600/30";
            btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-bounce">check_circle</span><span>Bạn đã sẵn sàng!</span>`;
            
            setTimeout(() => {
                document.getElementById('pageOverlay')?.classList.remove('hidden-overlay');
                setTimeout(() => window.location.href = 'index.html', 300);
            }, 1000);
        }

        function socialRegister(provider) {
            localStorage.setItem('primux_user_name', `Thành viên ${provider}`);
            localStorage.setItem('primux_is_elite', 'true');
            localStorage.setItem('primux_elite_plan', '6 Tháng');
            triggerReadySuccess("btnRegister");
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const pwd = document.getElementById('password').value.trim();
            const confirmPwd = document.getElementById('confirmPassword').value.trim();
            const alertBox = document.getElementById('registerAlert');
            const alertText = document.getElementById('registerAlertText');

            function showAlert(msg) {
                alertText.innerText = msg;
                alertBox.classList.remove('hidden');
            }

            if (!name || !email || !phone || !pwd || !confirmPwd) {
                showAlert("Vui lòng điền đầy đủ tất cả các trường!");
                return;
            }
            if (pwd !== confirmPwd) {
                showAlert("Mật khẩu xác nhận không khớp!");
                return;
            }

            alertBox.classList.add('hidden');
            localStorage.setItem('primux_user_name', name);
            localStorage.setItem('primux_user_email', email);
            localStorage.setItem('primux_user_phone', phone);

            triggerReadySuccess("btnRegister");
        });
    </script>
</body>
</html>
